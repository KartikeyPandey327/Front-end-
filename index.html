<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Live Global Weather Dashboard</title>
</head>
<body>
    <h1> Global weather tracker </h1>
    <form id="weather-form">
        <input type="text" id="city-input" placeholder="Enter city Name" attribute="required">
        <button type="submit">Get Weather</button>
    </form>

    <p id="status-msg"></p>
    <div id="weather-card">
        <h2 id="city-display"></h2>
        <h1><span id="temp-display"></span>*C</h1>
        <p>Humidity: <span id="humidity-display">--</span>%</p>
        <p>Wind Speed: <span id="wind-display">--</span> km/h</p>


    </div>
    <script src="script.js"></script>
</body>
</html>
